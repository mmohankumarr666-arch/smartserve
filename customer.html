<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartServe Menu</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* ── Image card menu grid ── */
      .customer-menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 14px;
        padding: 16px 16px 120px;
      }

      .menu-item {
        background: var(--surface, #fff);
        border: 1.5px solid var(--border, #e4e2da);
        border-radius: 14px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.18s, box-shadow 0.18s;
        cursor: default;
      }
      .menu-item:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }

      /* Image area */
      .menu-item-img {
        width: 100%;
        aspect-ratio: 4/3;
        object-fit: cover;
        background: #f0ede6;
        display: block;
      }
      .menu-item-placeholder {
        width: 100%;
        aspect-ratio: 4/3;
        background: linear-gradient(135deg, #f5f0e8, #ede8df);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.4rem;
      }

      /* Text area */
      .menu-item-body {
        padding: 10px 12px 6px;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .menu-item-body strong {
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text, #1a1a1a);
        line-height: 1.3;
      }
      .menu-item-body p {
        font-size: 0.75rem;
        color: var(--text-muted, #7a7670);
        margin-top: 3px;
        line-height: 1.4;
        flex: 1;
      }

      /* Bottom row */
      .item-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px 12px;
      }
      .item-bottom span {
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--text, #1a1a1a);
      }
      .add-btn {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: #1a1a1a;
        color: #fff;
        border: none;
        font-size: 1.2rem;
        line-height: 1;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, transform 0.15s;
        flex-shrink: 0;
      }
      .add-btn:hover { background: #333; transform: scale(1.1); }
      .add-btn:active { transform: scale(0.95); }

      /* In-cart indicator on card */
      .menu-item.in-cart { border-color: #1a1a1a; }
      .menu-item.in-cart .add-btn { background: #e8a230; }
      .cart-qty-badge {
        position: absolute;
        top: 8px; right: 8px;
        background: #1a1a1a;
        color: #fff;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 999px;
      }
      .menu-item-img-wrap { position: relative; }

      /* ── ORDER PLACED POPUP ── */
      .order-popup-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        backdrop-filter: blur(4px);
        z-index: 999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }
      .order-popup-overlay.show {
        opacity: 1;
        pointer-events: all;
      }
      .order-popup {
        background: #fff;
        border-radius: 22px;
        padding: 36px 28px 28px;
        max-width: 340px;
        width: 100%;
        text-align: center;
        box-shadow: 0 24px 60px rgba(0,0,0,0.25);
        transform: scale(0.88) translateY(16px);
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .order-popup-overlay.show .order-popup {
        transform: scale(1) translateY(0);
      }

      /* Checkmark animation */
      .popup-check {
        width: 72px; height: 72px;
        background: #f0fdf4;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
        font-size: 2.2rem;
        animation: popIn 0.5s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
      }
      @keyframes popIn {
        from { transform: scale(0); opacity: 0; }
        to   { transform: scale(1); opacity: 1; }
      }

      .popup-title {
        font-size: 1.3rem;
        font-weight: 800;
        color: #1a1a1a;
        margin-bottom: 6px;
      }
      .popup-sub {
        font-size: 0.85rem;
        color: #7a7670;
        margin-bottom: 20px;
        line-height: 1.5;
      }
      .popup-items {
        background: #f9f8f5;
        border-radius: 12px;
        padding: 14px 16px;
        text-align: left;
        margin-bottom: 20px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .popup-item-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.85rem;
        color: #1a1a1a;
      }
      .popup-item-row span:last-child { color: #7a7670; }

      /* Progress bar auto-dismiss */
      .popup-progress {
        height: 3px;
        background: #e8e4da;
        border-radius: 999px;
        overflow: hidden;
        margin-top: 8px;
      }
      .popup-progress-bar {
        height: 100%;
        background: #22c55e;
        border-radius: 999px;
        width: 100%;
        transform-origin: left;
        animation: shrink 3.5s linear forwards;
      }
      @keyframes shrink {
        from { transform: scaleX(1); }
        to   { transform: scaleX(0); }
      }

      .popup-dismiss {
        width: 100%;
        padding: 12px;
        background: #1a1a1a;
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        margin-top: 16px;
        transition: background 0.15s;
      }
      .popup-dismiss:hover { background: #333; }

      /* ── Empty state ── */
      .empty {
        grid-column: 1 / -1;
        text-align: center;
        padding: 40px;
        color: var(--text-muted, #7a7670);
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body class="customer-page">
    <main class="customer-shell">
      <header class="customer-header">
        <div>
          <p class="eyebrow">SmartServe menu</p>
          <h1 id="customer-table-title">Table 1</h1>
        </div>
        <div class="live-indicator">
          <span></span>
          <strong id="sync-status">Loading</strong>
        </div>
      </header>

      <nav class="category-tabs" aria-label="Menu categories">
        <button class="category-tab active" data-category="popular">Popular</button>
        <button class="category-tab" data-category="mains">Mains</button>
        <button class="category-tab" data-category="drinks">Drinks</button>
        <button class="category-tab" data-category="dessert">Dessert</button>
      </nav>

      <section id="menu-grid" class="menu-grid customer-menu-grid" aria-label="Restaurant menu"></section>

      <aside class="cart-panel customer-cart" aria-labelledby="cart-title">
        <div class="panel-heading compact" id="cart-toggle-btn" style="cursor:pointer;">
          <div>
            <p class="eyebrow">Same-table bill</p>
            <h2 id="cart-title">Current round</h2>
          </div>
          <div style="display:flex;align-items:center;gap:12px;">
            <strong id="cart-total">₹0</strong>
            <span id="cart-arrow" style="font-size:20px;transition:transform 0.25s;">▼</span>
          </div>
        </div>
        <div id="cart-body" style="display:none;">
          <div id="cart-lines" class="cart-lines empty">Add items to begin.</div>
          <div class="customer-actions">
            <button id="place-order-btn" class="primary-action" disabled>Place Order</button>
            <button id="request-bill-btn" class="secondary-action">Request Bill</button>
          </div>
        </div>
      </aside>
    </main>

    <!-- ── ORDER PLACED POPUP ── -->
    <div class="order-popup-overlay" id="order-popup-overlay">
      <div class="order-popup">
        <div class="popup-check">✅</div>
        <div class="popup-title">Order Placed!</div>
        <p class="popup-sub">We've got your order.<br>Sit back and relax 😊</p>
        <div class="popup-items" id="popup-items-list"></div>
        <div class="popup-progress"><div class="popup-progress-bar" id="popup-bar"></div></div>
        <button class="popup-dismiss" id="popup-dismiss-btn">Got it 👍</button>
      </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="customer.js"></script>
  </body>
</html>
