<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartServe Admin</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');
      :root {
        --bg: #f5f4f0; --surface: #fff; --border: #e4e2da;
        --accent: #1a1a1a; --accent2: #e8572a; --text: #1a1a1a;
        --muted: #7a7670; --green: #1e8a4a; --green-bg: #edf7f1;
        --red: #c0392b; --red-bg: #fef2f2; --amber: #b45309; --amber-bg: #fef3c7;
        --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.06);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; font-size: 15px; }
      .hidden { display: none !important; }

      /* ── Login ── */
      .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .login-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px; width: 360px; display: flex; flex-direction: column; gap: 20px; }
      .login-card h1 { font-size: 1.5rem; }
      .eyebrow { font-size: 0.72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
      label { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; font-weight: 600; letter-spacing: .03em; color: var(--muted); }
      input { padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; color: var(--text); background: #fff; outline: none; transition: border-color .15s; }
      input:focus { border-color: var(--accent); }
      .btn-primary { background: var(--accent); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
      .btn-primary:hover { opacity: .85; }
      .btn-sm { padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; }
      .btn-success { background: var(--green); color: #fff; }
      .btn-danger  { background: var(--red); color: #fff; }
      .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
      .msg { font-size: 0.82rem; padding: 8px 12px; border-radius: 6px; }
      .msg.error { background: var(--red-bg); color: var(--red); }
      .msg.info  { background: var(--green-bg); color: var(--green); }

      /* ── Dashboard ── */
      .admin-shell { max-width: 900px; margin: 0 auto; padding: 32px 20px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
      .topbar h1 { font-size: 1.4rem; }
      .topbar .right { display: flex; gap: 10px; align-items: center; }
      .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
      .badge.active  { background: var(--green-bg); color: var(--green); }
      .badge.expired { background: var(--red-bg); color: var(--red); }
      .badge.monthly { background: #eff6ff; color: #1d4ed8; }
      .badge.yearly  { background: #f5f3ff; color: #6d28d9; }

      /* ── Cards ── */
      .cards-grid { display: grid; gap: 14px; }
      .sub-card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 22px; display: grid; grid-template-columns: 1fr auto; gap: 12px 20px; align-items: start; }
      .sub-card .name { font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
      .sub-card .meta { font-size: 0.8rem; color: var(--muted); line-height: 1.7; }
      .sub-card .meta strong { color: var(--text); }
      .sub-card .actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
      .extend-row { display: flex; gap: 8px; align-items: center; }
      .extend-row input[type=date] { padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 6px; font-size: 0.8rem; }
      .empty-state { text-align: center; padding: 60px; color: var(--muted); }
      .stats-strip { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
      .stat { background: var(--surface); border-radius: 10px; padding: 16px 20px; flex: 1; min-width: 120px; box-shadow: var(--shadow); }
      .stat .label { font-size: 0.72rem; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
      .stat .value { font-size: 1.5rem; font-weight: 700; margin-top: 4px; }
    </style>
  </head>
  <body>

    <!-- Login -->
    <section id="login-section" class="login-wrap">
      <div class="login-card">
        <div>
          <p class="eyebrow">Platform owner</p>
          <h1>SmartServe Admin</h1>
        </div>
        <label>Email<input id="admin-email" type="email" autocomplete="email" /></label>
        <label>Password<input id="admin-password" type="password" /></label>
        <button class="btn-primary" id="admin-login-btn">Sign In</button>
        <p id="admin-login-msg" class="msg info">Sign in with your admin account.</p>
      </div>
    </section>

    <!-- Dashboard -->
    <main id="admin-dashboard" class="admin-shell hidden">
      <div class="topbar">
        <div>
          <p class="eyebrow">Platform owner</p>
          <h1>SmartServe Admin</h1>
        </div>
        <div class="right">
          <span id="admin-email-label" style="font-size:.82rem;color:var(--muted)"></span>
          <button class="btn-sm btn-outline" id="admin-logout-btn">Sign Out</button>
        </div>
      </div>

      <div class="stats-strip">
        <div class="stat"><div class="label">Total restaurants</div><div class="value" id="stat-total">—</div></div>
        <div class="stat"><div class="label">Active</div><div class="value" id="stat-active" style="color:var(--green)">—</div></div>
        <div class="stat"><div class="label">Expired</div><div class="value" id="stat-expired" style="color:var(--red)">—</div></div>
        <div class="stat"><div class="label">Monthly plans</div><div class="value" id="stat-monthly">—</div></div>
        <div class="stat"><div class="label">Yearly plans</div><div class="value" id="stat-yearly">—</div></div>
      </div>

      <div id="sub-cards" class="cards-grid">
        <div class="empty-state">Loading subscriptions…</div>
      </div>
    </main>

    <script src="firebase-config.js"></script>
    <script>
      const FBV = "10.12.5";
      let authMod, fsMod, db, auth;

      async function boot() {
        const [appM, authM, fsM] = await Promise.all([
          import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-app.js`),
          import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-auth.js`),
          import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-firestore.js`),
        ]);
        authMod = authM; fsMod = fsM;
        const app = appM.initializeApp(window.SMARTSERVE_FIREBASE_CONFIG);
        auth = authM.getAuth(app);
        db   = fsM.getFirestore(app);

        authM.onAuthStateChanged(auth, async (user) => {
          if (!user) { showLogin(); return; }
          // Verify admin
          const snap = await fsM.getDoc(fsM.doc(db, "admins", user.uid));
          if (!snap.exists()) {
            showMsg("This account is not an admin.", true);
            await authM.signOut(auth);
            return;
          }
          showDashboard(user);
        });
      }

      function showLogin() {
        document.getElementById("login-section").classList.remove("hidden");
        document.getElementById("admin-dashboard").classList.add("hidden");
      }
      function showDashboard(user) {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("admin-dashboard").classList.remove("hidden");
        document.getElementById("admin-email-label").textContent = user.email;
        loadSubscriptions();
      }
      function showMsg(text, isError) {
        const el = document.getElementById("admin-login-msg");
        el.textContent = text;
        el.className = "msg " + (isError ? "error" : "info");
      }

      async function loadSubscriptions() {
        const snap = await fsMod.getDocs(fsMod.collection(db, "subscriptions"));
        const subs = [];
        snap.forEach(d => subs.push(d.data()));
        subs.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        renderCards(subs);
        renderStats(subs);
      }

      function isExpired(sub) {
        return sub.status !== "active" || new Date(sub.expiryDate) < new Date();
      }

      function renderStats(subs) {
        document.getElementById("stat-total").textContent   = subs.length;
        document.getElementById("stat-active").textContent  = subs.filter(s => !isExpired(s)).length;
        document.getElementById("stat-expired").textContent = subs.filter(s => isExpired(s)).length;
        document.getElementById("stat-monthly").textContent = subs.filter(s => s.plan === "monthly").length;
        document.getElementById("stat-yearly").textContent  = subs.filter(s => s.plan === "yearly").length;
      }

      function renderCards(subs) {
        const container = document.getElementById("sub-cards");
        if (!subs.length) {
          container.innerHTML = '<div class="empty-state">No restaurants registered yet.</div>';
          return;
        }
        container.innerHTML = subs.map(sub => {
          const expired  = isExpired(sub);
          const expDate  = new Date(sub.expiryDate).toLocaleDateString("en-IN", { dateStyle: "medium" });
          const startDate = new Date(sub.startDate).toLocaleDateString("en-IN", { dateStyle: "medium" });
          // Default extend date: +1 month or +1 year depending on plan
          const defaultExtend = new Date();
          if (sub.plan === "yearly") defaultExtend.setFullYear(defaultExtend.getFullYear() + 1);
          else defaultExtend.setMonth(defaultExtend.getMonth() + 1);
          const defaultExtendStr = defaultExtend.toISOString().split("T")[0];

          return `
          <div class="sub-card" id="card-${sub.restaurantId}">
            <div>
              <div class="name">${escHtml(sub.restaurantName || sub.restaurantId)}</div>
              <div class="meta">
                <strong>ID:</strong> ${escHtml(sub.restaurantId)}<br>
                <strong>Owner:</strong> ${escHtml(sub.ownerName || "—")} (${escHtml(sub.ownerEmail || "—")})<br>
                <strong>Plan:</strong> <span class="badge ${sub.plan}">${sub.plan}</span><br>
                <strong>Started:</strong> ${startDate}<br>
                <strong>Expires:</strong> ${expDate}
              </div>
            </div>
            <div class="actions">
              <span class="badge ${expired ? "expired" : "active"}">${expired ? "Expired" : "Active"}</span>
              <div class="extend-row">
                <input type="date" id="date-${sub.restaurantId}" value="${defaultExtendStr}" min="${new Date().toISOString().split('T')[0]}" />
                <button class="btn-sm btn-success" onclick="activateSub('${sub.restaurantId}')">Activate</button>
              </div>
              <button class="btn-sm btn-danger" onclick="suspendSub('${sub.restaurantId}')">Suspend</button>
            </div>
          </div>`;
        }).join("");
      }

      async function activateSub(restaurantId) {
        const dateInput = document.getElementById("date-" + restaurantId);
        const newExpiry = new Date(dateInput.value);
        if (!dateInput.value || isNaN(newExpiry)) { alert("Pick a valid expiry date."); return; }
        newExpiry.setHours(23, 59, 59, 999);
        try {
          await fsMod.updateDoc(fsMod.doc(db, "subscriptions", restaurantId), {
            status: "active",
            expiryDate: newExpiry.toISOString(),
          });
          alert("✅ Subscription activated for " + restaurantId + " until " + newExpiry.toLocaleDateString("en-IN"));
          loadSubscriptions();
        } catch(e) { alert("Error: " + e.message); }
      }

      async function suspendSub(restaurantId) {
        if (!confirm("Suspend subscription for " + restaurantId + "? They will lose dashboard access immediately.")) return;
        try {
          await fsMod.updateDoc(fsMod.doc(db, "subscriptions", restaurantId), { status: "suspended" });
          alert("Subscription suspended.");
          loadSubscriptions();
        } catch(e) { alert("Error: " + e.message); }
      }

      function escHtml(v) {
        return String(v).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      }

      document.getElementById("admin-login-btn").addEventListener("click", async () => {
        const email    = document.getElementById("admin-email").value.trim();
        const password = document.getElementById("admin-password").value;
        showMsg("Signing in...");
        try {
          await authMod.signInWithEmailAndPassword(auth, email, password);
        } catch(e) {
          const msgs = {
            "auth/invalid-credential": "Invalid email or password.",
            "auth/user-not-found": "No account found.",
            "auth/wrong-password": "Wrong password.",
          };
          showMsg(msgs[e.code] || e.message, true);
        }
      });

      document.getElementById("admin-logout-btn").addEventListener("click", async () => {
        await authMod.signOut(auth);
      });

      boot();
    </script>
  </body>
</html>
